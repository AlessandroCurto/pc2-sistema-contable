{% extends "nucleo/base.html" %}

{% block encabezado %}Editar cuenta{% endblock %}
{% block subtitulo %}{{ cuenta.codigo }} - {{ cuenta.nombre }}{% endblock %}

{% block contenido %}
  <div class="tarjeta">
    <div class="tarjeta-cuerpo">
      <form method="post">
        {% csrf_token %}
        {% include "nucleo/_campos.html" with formulario=formulario %}
        <div class="lista-acciones" style="margin-top: 14px">
          <button class="boton" type="submit">Guardar cambios</button>
          <a class="boton secundario" href="{% url 'plan_cuentas' %}">Cancelar</a>
        </div>
      </form>
    </div>
  </div>
{% endblock %}
